name: CI/CD Multi-Tenant Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 1. Extrai o Short Hash do Commit para cumprir o requisito de versionamento
      - name: Obter Short Git Commit Hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 2. Conectar ao Tailscale para acesso seguro à VM
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # 3. Login no Docker Hub (Certifique-se de adicionar DOCKER_USERNAME e DOCKER_PASSWORD nos Secrets do GitHub)
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build e Push da Imagem Docker com tag SemVer/Short Hash
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cliente1-app:latest
            ${{ secrets.DOCKER_USERNAME }}/cliente1-app:${{ steps.vars.outputs.sha_short }}

      # 5. Executando o Deploy via SSH na VM através do Tailscale
      - name: Executando Deploy via SSH na VM
        uses: appleboy/ssh-action@master
        with:
          host: 100.121.27.82
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/deploy/cliente1
            # Atualiza o arquivo com a nova tag gerada ou puxa a versão mais recente
            docker-compose pull
            docker-compose up -d --build
