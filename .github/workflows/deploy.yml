name: CI/CD Multi-Tenant Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Conecta o GitHub Actions à sua rede privada do Tailscale
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Ou, se preferir usar uma Auth Key estática gerada no painel do Tailscale:
      # - name: Conectar ao Tailscale (Auth Key)
      #   uses: tailscale/github-action@v2
      #   with:
      #     authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Executando Deploy via SSH na VM
        uses: appleboy/ssh-action@master
        with:
          host: 100.121.27.82
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            cd ~/deploy/cliente1
            git pull origin main || true
            docker-compose pull
            docker-compose up -d --build
