name: Multi-Client Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPOSITORY }}:${{ steps.version.outputs.version }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: [cliente1, cliente2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to cliente ${{ matrix.client }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SRV_HOST }}
          username: ${{ secrets.SRV_USERNAME }}
          key: ${{ secrets.SRV_KEY }}
          script: |
            cd ~/deploy/${{ matrix.client }}
            VERSION="${{ steps.version.outputs.version }}"
            if [ -f .env ]; then
              sed -i "s|^APP_VERSION=.*|APP_VERSION=$VERSION|" .env || echo "APP_VERSION=$VERSION" >> .env
            else
              echo "APP_VERSION=$VERSION" > .env
            fi
            docker compose pull app
            docker compose up -d 
