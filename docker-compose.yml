version: '3.8'

networks:
  client1-nw:
    external: true
  proxy-nw:
    external: true

services:
  db:
    image: mysql:8.0
    container_name: cliente1-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha_root_segura
      MYSQL_DATABASE: cliente1_db
      MYSQL_USER: cliente1_user
      MYSQL_PASSWORD: senha_usuario
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - client1-nw

  app:
    image: nginx:alpine
    container_name: cliente1-app
    restart: always
    networks:
      - client1-nw
      - proxy-nw

volumes:
  db_data:
